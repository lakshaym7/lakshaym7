# Place this file at: .github/workflows/profile-3d.yml
# It generates a 3D isometric contribution calendar and commits the SVGs into your repo,
# so the graphic is served from your own repository and never rate-limits.

name: GitHub 3D Contribution Calendar

on:
  # Rebuild once a day
  schedule:
    - cron: "0 18 * * *"
  # Let you run it on demand from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D calendar SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: regenerate 3d contribution calendar" || echo "nothing to commit"
          git push
